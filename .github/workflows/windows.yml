name: Windows
run-name: Windows ${{ inputs.mode }} runtime at ${{ inputs.source_head }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [Menu, Sleep]
        default: Menu
      source_head:
        type: string
        required: true
      app_run:
        description: Reuse the exact-source native app artifact from this run
        type: string
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD: ${{ inputs.source_head }}
      MODE: ${{ inputs.mode }}
      APP_RUN: ${{ inputs.app_run }}
      NATIVE_APP: apps/browser/windows/x64/Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the exact product source
        shell: pwsh
        run: |
          $parent = git rev-parse HEAD^
          if ($LASTEXITCODE -ne 0 -or $parent -ne $env:SOURCE_HEAD) { throw 'The test commit must directly follow the selected PR head' }
          $changed = @(git diff --name-only $env:SOURCE_HEAD HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare source trees' }
          $unexpected = @($changed | Where-Object { $_ -notin @('.github/workflows/windows.yml', 'scripts/windows/menu-runtime.ps1') })
          if ($unexpected.Count) { throw "Unexpected product source changes: $unexpected" }
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/runtime-evidence" | Out-Null
          @{ source_head = $env:SOURCE_HEAD; test_head = (git rev-parse HEAD); source_tree = (git rev-parse "$($env:SOURCE_HEAD)^{tree}"); mode = $env:MODE; environment = 'windows-2025 x64'; engine_pin = (Get-Content scripts/windows/engine/prebuilt.json -Raw | ConvertFrom-Json) } | ConvertTo-Json -Depth 8 | Set-Content "${{ runner.temp }}/runtime-evidence/source.json"
      - name: Parse the runtime probe before building
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/windows/menu-runtime.ps1).Path, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Report runtime verification on the PR source commit
        id: runtime_status
        shell: pwsh
        run: |
          $context = "windows-runtime/$($env:MODE.ToLowerInvariant())"
          gh api --method POST "repos/ardia-browser/ardia/statuses/$env:SOURCE_HEAD" -f state=pending -f "context=$context" -f "target_url=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" -f "description=Production Windows interaction verification is running" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not report runtime verification status' }
      - name: Reuse a verified exact-source native app
        if: inputs.app_run != ''
        shell: pwsh
        run: |
          $run = gh api "repos/ardia-browser/ardia/actions/runs/$env:APP_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the native build run' }
          gh run download $env:APP_RUN --repo ardia-browser/ardia --name exact-source-native-app --dir "${{ runner.temp }}/reused-native"
          if ($LASTEXITCODE -ne 0) { throw 'Exact-source native app download failed' }
          $identity = Get-Content "${{ runner.temp }}/reused-native/source.json" -Raw | ConvertFrom-Json
          $expectedTree = git rev-parse "$($env:SOURCE_HEAD)^{tree}"
          if ($LASTEXITCODE -ne 0 -or $identity.source_head -ne $env:SOURCE_HEAD -or $identity.source_tree -ne $expectedTree -or $identity.test_head -ne $run.head_sha) { throw 'The native artifact was built from different product source' }
          Copy-Item -LiteralPath "${{ runner.temp }}/reused-native/source.json" -Destination "${{ runner.temp }}/runtime-evidence/native-source.json"
          "NATIVE_APP=${{ runner.temp }}/reused-native/app" | Add-Content $env:GITHUB_ENV
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: inputs.app_run == ''

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: inputs.app_run == ''
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: inputs.app_run == ''
      - name: Compile the exact source without a native app cache
        if: inputs.app_run == ''
        working-directory: apps/browser
        shell: pwsh
        run: |
          npx react-native run-windows --release --arch x64 --no-launch --no-deploy --no-packager --no-telemetry --logging
          exit $LASTEXITCODE
      - name: Preserve the compiled app for follow-up runtime tests
        if: inputs.app_run == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/compiled-app" | Out-Null
          Copy-Item -Recurse -LiteralPath apps/browser/windows/x64/Release -Destination "${{ runner.temp }}/compiled-app/app"
          Copy-Item -LiteralPath "${{ runner.temp }}/runtime-evidence/source.json" -Destination "${{ runner.temp }}/compiled-app/source.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.app_run == ''
        with:
          name: exact-source-native-app
          path: ${{ runner.temp }}/compiled-app
          if-no-files-found: error
          retention-days: 7
      - name: Fetch the engine
        shell: pwsh
        run: scripts/windows/fetch-engine.ps1 -Cpu x64 -Out "${{ runner.temp }}/engine"
      - name: Assemble the app with its engine
        id: assemble
        shell: pwsh
        run: scripts/windows/assemble.ps1 -App $env:NATIVE_APP -Engine "${{ runner.temp }}/engine" -Out "${{ runner.temp }}/Ardia"
      - name: Record the binary identities
        shell: pwsh
        run: |
          @('Ardia.exe', 'ArdiaApp.dll', 'Bundle/index.windows.bundle') | ForEach-Object { Get-FileHash -Algorithm SHA256 -LiteralPath "${{ runner.temp }}/Ardia/$_" } | Select-Object Path, Hash | ConvertTo-Json | Set-Content "${{ runner.temp }}/runtime-evidence/binary-hashes.json"
      - name: Verify production interactions
        continue-on-error: ${{ inputs.mode == 'Sleep' }}
        timeout-minutes: 9
        shell: pwsh
        run: scripts/windows/menu-runtime.ps1 -App "${{ runner.temp }}/Ardia/Ardia.exe" -Out "${{ runner.temp }}/runtime-evidence/main" -Mode $env:MODE
      - name: Verify seeded production interactions
        continue-on-error: ${{ inputs.mode == 'Sleep' }}
        if: ${{ always() && steps.assemble.outcome == 'success' }}
        timeout-minutes: 9
        shell: pwsh
        run: scripts/windows/menu-runtime.ps1 -App "${{ runner.temp }}/Ardia/Ardia.exe" -Out "${{ runner.temp }}/runtime-evidence/seed" -Mode "Seed$env:MODE"
      - name: Verify combined sleep coverage
        if: ${{ always() && inputs.mode == 'Sleep' && steps.assemble.outcome == 'success' }}
        shell: pwsh
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/runtime-evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:EVIDENCE_ROOT
          $main = Get-Content -LiteralPath (Join-Path $root 'main/results.json') -Raw | ConvertFrom-Json
          $seed = Get-Content -LiteralPath (Join-Path $root 'seed/results.json') -Raw | ConvertFrom-Json
          if ($main.mode -ne 'Sleep' -or $seed.mode -ne 'SeedSleep') { throw 'Wrong probe modes for combined sleep coverage' }
          $mainIds = @('sleep-hidden', 'sleep-front', 'sleep-form', 'sleep-audio', 'sleep-group-nested', 'sleep-pip', 'sleep-shared-family')
          $seedIds = @('seed-nested-group', 'seed-shared-pin-visible', 'seed-shared-pin-hidden', 'seed-pip-paused', 'seed-pip-control')
          $covered = @{
            'sleep-group-nested' = @('seed-nested-group')
            'sleep-pip' = @('seed-pip-paused', 'seed-pip-control')
            'sleep-shared-family' = @('seed-shared-pin-visible', 'seed-shared-pin-hidden')
          }
          $groups = @(@{ Data = $main; Ids = $mainIds }, @{ Data = $seed; Ids = $seedIds })
          foreach ($group in $groups) {
            $rows = @($group.Data.tests)
            $actualIds = @($rows | ForEach-Object { $_.id })
            if ($rows.Count -ne $group.Ids.Count -or @($actualIds | Select-Object -Unique).Count -ne $rows.Count -or @(Compare-Object $group.Ids $actualIds).Count) { throw "Missing, duplicate or unexpected cases in $($group.Data.mode)" }
            foreach ($row in $rows) {
              if ($row.status -eq 'pass') {
                if (-not @($row.checks).Count -or @($row.checks | Where-Object { $_.ok -ne $true }).Count) { throw "Invalid passing assertions for $($row.id)" }
                continue
              }
              if ($group.Data.mode -ne 'Sleep' -or $row.status -ne 'unsupported' -or -not $covered.ContainsKey($row.id)) { throw "Unproven case $($row.id): $($row.status)" }
              foreach ($required in $covered[$row.id]) {
                $proof = @($seed.tests | Where-Object { $_.id -eq $required -and $_.status -eq 'pass' })
                if ($proof.Count -ne 1) { throw "No passing seeded proof for $($row.id): $required" }
              }
            }
          }
          if ($seed.verdict -ne 'pass' -or $main.verdict -notin @('pass', 'incomplete')) { throw 'A probe did not finish with the expected verdict' }
          $passed = @($main.tests + $seed.tests | Where-Object { $_.status -eq 'pass' }).Count
          $report = @{ verdict = 'pass'; passing_cases = $passed; basic = $mainIds; seeded = $seedIds; covered_basic_placeholders = $covered }
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $root 'combined-sleep.json')
          $summary = "Combined sleep coverage passed: $passed executed cases. The nested-group, PiP and shared-family placeholders are covered by the named seeded cases; both original reports are retained."
          Write-Output $summary
          if ($env:GITHUB_STEP_SUMMARY) { $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: runtime-evidence
          path: ${{ runner.temp }}/runtime-evidence
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: build-logs
          path: |
            apps/browser/windows/**/*.binlog
            apps/browser/windows/**/*.err
            apps/browser/windows/**/*.wrn
          if-no-files-found: ignore
          retention-days: 7
      - name: Report the runtime result on the PR source commit
        if: ${{ always() && steps.runtime_status.outcome == 'success' }}
        shell: pwsh
        env:
          RUNTIME_JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:RUNTIME_JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') { 'Production interaction checks passed' } else { 'Runtime proof failed or remains incomplete; inspect evidence' }
          $context = "windows-runtime/$($env:MODE.ToLowerInvariant())"
          gh api --method POST "repos/ardia-browser/ardia/statuses/$env:SOURCE_HEAD" -f "state=$state" -f "context=$context" -f "target_url=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" -f "description=$description" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not report the runtime result' }
      - name: Notify that menu smoke evidence is ready
        if: always()
        shell: pwsh
        run: |
          gh api --method POST repos/ardia-browser/ardia/statuses/537126ea334ac1f2126e00187d0fc1e2b5a60017 -f state=failure -f context=windows-diagnostic/menu-smoke -f "target_url=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" -f "description=Menu smoke finished; inspect evidence and coverage gaps" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not report smoke completion' }
