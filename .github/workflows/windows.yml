name: Windows
run-name: Windows menu page-focus diagnostic at ${{ inputs.source_head }}
on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Diagnostic product commit (logs only, direct child of diagnostic_base)
        type: string
        required: true
      diagnostic_base:
        description: PR head the diagnostic product commit adds logs to
        type: string
        default: 537126ea334ac1f2126e00187d0fc1e2b5a60017
      cases:
        description: Comma-separated probe case ids to run; every other case is reported not-run
        type: string
        default: page-focus,page-focus-long-press
      app_run:
        description: Reuse the exact-source native app artifact from this run
        type: string
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD: ${{ inputs.source_head }}
      DIAGNOSTIC_BASE: ${{ inputs.diagnostic_base }}
      CASES: ${{ inputs.cases }}
      APP_RUN: ${{ inputs.app_run }}
      NATIVE_APP: apps/browser/windows/x64/Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify the diagnostic and product source lineage
        shell: pwsh
        run: |
          $testParents = @((git rev-list --parents -n 1 HEAD) -split ' ' | Select-Object -Skip 1)
          if ($LASTEXITCODE -ne 0 -or $testParents.Count -ne 1 -or $testParents[0] -ne $env:SOURCE_HEAD) { throw 'The test commit must have exactly one parent: the diagnostic product commit' }
          $productParents = @((git rev-list --parents -n 1 $env:SOURCE_HEAD) -split ' ' | Select-Object -Skip 1)
          if ($LASTEXITCODE -ne 0 -or $productParents.Count -ne 1 -or $productParents[0] -ne $env:DIAGNOSTIC_BASE) { throw 'The diagnostic product commit must have exactly one parent: the PR head named in diagnostic_base' }
          $testChanged = @(git diff --name-only $env:SOURCE_HEAD HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare the test commit' }
          $unexpectedTest = @($testChanged | Where-Object { $_ -notin @('.github/workflows/windows.yml', 'scripts/windows/menu-runtime.ps1') })
          if ($unexpectedTest.Count) { throw "Unexpected test commit changes: $unexpectedTest" }
          $productChanged = @(git diff --name-only $env:DIAGNOSTIC_BASE $env:SOURCE_HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare the diagnostic product commit' }
          $allowedProduct = @('apps/browser/windows/Ardia/WindowManager.h', 'apps/browser/windows/Ardia/MenuKeyboard.h', 'apps/browser/windows/Ardia/MenusModule.h')
          $unexpectedProduct = @($productChanged | Where-Object { $_ -notin $allowedProduct })
          if ($unexpectedProduct.Count -or -not $productChanged.Count) { throw "Unexpected diagnostic product changes: $unexpectedProduct" }
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/runtime-evidence" | Out-Null
          @{
            purpose = 'scoped page-focus diagnostic; not a full Windows menu verification'
            source_head = $env:SOURCE_HEAD
            source_tree = (git rev-parse "$($env:SOURCE_HEAD)^{tree}")
            diagnostic_base = $env:DIAGNOSTIC_BASE
            diagnostic_base_tree = (git rev-parse "$($env:DIAGNOSTIC_BASE)^{tree}")
            diagnostic_product_files = $productChanged
            test_head = (git rev-parse HEAD)
            cases = $env:CASES
            environment = 'windows-2025 x64'
            engine_pin = (Get-Content scripts/windows/engine/prebuilt.json -Raw | ConvertFrom-Json)
          } | ConvertTo-Json -Depth 8 | Set-Content "${{ runner.temp }}/runtime-evidence/source.json"
      - name: Report the diagnostic start
        shell: pwsh
        run: |
          gh api --method POST "repos/ardia-browser/ardia/statuses/$env:DIAGNOSTIC_BASE" -f state=pending -f context=windows-diagnostic/focus -f "target_url=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" -f "description=Scoped diagnostic running; not production verification" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not report the diagnostic start' }
      - name: Parse the runtime probe before building
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/windows/menu-runtime.ps1).Path, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Reuse a verified exact-source native app
        if: inputs.app_run != ''
        shell: pwsh
        run: |
          $run = gh api "repos/ardia-browser/ardia/actions/runs/$env:APP_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the native build run' }
          gh run download $env:APP_RUN --repo ardia-browser/ardia --name exact-source-native-app --dir "${{ runner.temp }}/reused-native"
          if ($LASTEXITCODE -ne 0) { throw 'Exact-source native app download failed' }
          $identity = Get-Content "${{ runner.temp }}/reused-native/source.json" -Raw | ConvertFrom-Json
          $expectedTree = git rev-parse "$($env:SOURCE_HEAD)^{tree}"
          if ($LASTEXITCODE -ne 0 -or $identity.source_head -ne $env:SOURCE_HEAD -or $identity.source_tree -ne $expectedTree -or $identity.test_head -ne $run.head_sha) { throw 'The native artifact was built from different product source' }
          Copy-Item -LiteralPath "${{ runner.temp }}/reused-native/source.json" -Destination "${{ runner.temp }}/runtime-evidence/native-source.json"
          "NATIVE_APP=${{ runner.temp }}/reused-native/app" | Add-Content $env:GITHUB_ENV
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: inputs.app_run == ''

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: inputs.app_run == ''
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: inputs.app_run == ''
      - name: Compile the diagnostic source without a native app cache
        if: inputs.app_run == ''
        working-directory: apps/browser
        shell: pwsh
        run: |
          npx react-native run-windows --release --arch x64 --no-launch --no-deploy --no-packager --no-telemetry --logging
          exit $LASTEXITCODE
      - name: Preserve the compiled app for follow-up diagnostic runs
        if: inputs.app_run == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/compiled-app" | Out-Null
          Copy-Item -Recurse -LiteralPath apps/browser/windows/x64/Release -Destination "${{ runner.temp }}/compiled-app/app"
          Copy-Item -LiteralPath "${{ runner.temp }}/runtime-evidence/source.json" -Destination "${{ runner.temp }}/compiled-app/source.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.app_run == ''
        with:
          name: exact-source-native-app
          path: ${{ runner.temp }}/compiled-app
          if-no-files-found: error
          retention-days: 7
      - name: Fetch the engine
        shell: pwsh
        run: scripts/windows/fetch-engine.ps1 -Cpu x64 -Out "${{ runner.temp }}/engine"
      - name: Assemble the app with its engine
        id: assemble
        shell: pwsh
        run: scripts/windows/assemble.ps1 -App $env:NATIVE_APP -Engine "${{ runner.temp }}/engine" -Out "${{ runner.temp }}/Ardia"
      - name: Record the binary identities
        shell: pwsh
        run: |
          @('Ardia.exe', 'ArdiaApp.dll', 'Bundle/index.windows.bundle') | ForEach-Object { Get-FileHash -Algorithm SHA256 -LiteralPath "${{ runner.temp }}/Ardia/$_" } | Select-Object Path, Hash | ConvertTo-Json | Set-Content "${{ runner.temp }}/runtime-evidence/binary-hashes.json"
      - name: Run the scoped page-focus diagnostic
        id: diagnostic
        timeout-minutes: 9
        shell: pwsh
        run: |
          $cases = @($env:CASES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if (-not $cases.Count) { throw 'No diagnostic cases were named' }
          $out = "${{ runner.temp }}/runtime-evidence/main"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          scripts/windows/menu-runtime.ps1 -App "${{ runner.temp }}/Ardia/Ardia.exe" -Out $out -Mode Menu -Only $cases -InputTrace (Join-Path $out 'input-trace.log')
      - name: Verify seeded production interactions
        if: ${{ false }}
        shell: pwsh
        run: scripts/windows/menu-runtime.ps1 -App "${{ runner.temp }}/Ardia/Ardia.exe" -Out "${{ runner.temp }}/runtime-evidence/seed" -Mode SeedMenu
      - name: Summarize the scoped diagnostic
        if: ${{ always() && steps.assemble.outcome == 'success' }}
        shell: pwsh
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/runtime-evidence
        run: |
          $results = Join-Path $env:EVIDENCE_ROOT 'main/results.json'
          if (-not (Test-Path -LiteralPath $results)) { throw 'The diagnostic wrote no results' }
          $main = Get-Content -LiteralPath $results -Raw | ConvertFrom-Json
          $lines = @(
            "Scoped page-focus diagnostic: $($main.verdict). This run is not a Windows menu verification; seeded cases were disabled and every case outside '$env:CASES' is not-run or unsupported."
            ''
            '| Case | Status |'
            '| --- | --- |'
          )
          $lines += @($main.tests | ForEach-Object { "| $($_.id) | $($_.status) |" })
          $lines | Write-Output
          if ($env:GITHUB_STEP_SUMMARY) { $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: menu-focus-diagnostic-evidence
          path: ${{ runner.temp }}/runtime-evidence
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure() && inputs.app_run == ''
        with:
          name: build-logs
          path: |
            apps/browser/windows/**/*.binlog
            apps/browser/windows/**/*.err
            apps/browser/windows/**/*.wrn
          if-no-files-found: ignore
          retention-days: 7
      - name: Report diagnostic evidence availability
        if: always()
        shell: pwsh
        run: |
          gh api --method POST "repos/ardia-browser/ardia/statuses/$env:DIAGNOSTIC_BASE" -f state=failure -f context=windows-diagnostic/focus -f "target_url=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" -f "description=Diagnostic finished; inspect traces, not merge evidence" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not report diagnostic completion' }
